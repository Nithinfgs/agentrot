<svg xmlns="http://www.w3.org/2000/svg" width="955" height="1105" viewBox="0 0 955 1105" role="img" aria-label="Terminal output of: npx agentrot">
  <rect width="955" height="1105" rx="10" fill="#0d1117"/>
  <rect width="955" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="955" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14">
  <text x="24" y="62" textLength="117.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">npx agentrot</tspan></text>
  <text x="24" y="83" textLength="646.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">agentrot 0.1.0</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">· Scanned 2 instruction files · ~347 tokens loaded per session</tspan></text>
  <text x="24" y="104" textLength="0" lengthAdjust="spacing" xml:space="preserve"></text>
  <text x="24" y="125" textLength="75.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9" text-decoration="underline">AGENTS.md</tspan></text>
  <text x="24" y="146" textLength="873.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">info </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 1</tspan><tspan fill="#c9d1d9">  package.json has "build" but the instructions never say how to run it  </tspan><tspan fill="#8b949e">undocumented-command</tspan></text>
  <text x="24" y="167" textLength="562.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Agents that cannot find a command tend to guess one.</tspan></text>
  <text x="24" y="188" textLength="554.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 3</tspan><tspan fill="#c9d1d9">  Says Node 16, but the repo requires 22  </tspan><tspan fill="#8b949e">stale-version</tspan></text>
  <text x="24" y="209" textLength="470.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ React + Vite dashboard. Requires Node 16.</tspan></text>
  <text x="24" y="230" textLength="495.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Check .nvmrc / .node-version / engines.node.</tspan></text>
  <text x="24" y="251" textLength="772.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 7</tspan><tspan fill="#c9d1d9">  Uses npm (3 commands) but the repo is set up for pnpm  </tspan><tspan fill="#8b949e">package-manager-mismatch</tspan></text>
  <text x="24" y="272" textLength="327.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Install: `npm install`</tspan></text>
  <text x="24" y="293" textLength="739.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Agents will follow this and create a second lockfile. Use `pnpm` instead.</tspan></text>
  <text x="24" y="314" textLength="688.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 9</tspan><tspan fill="#c9d1d9">  `npm run lint` — no "lint" script in any package.json  </tspan><tspan fill="#8b949e">missing-script</tspan></text>
  <text x="24" y="335" textLength="462" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Lint before committing: `npm run lint`</tspan></text>
  <text x="24" y="356" textLength="420" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Available scripts: dev, build, test</tspan></text>
  <text x="24" y="377" textLength="688.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">10</tspan><tspan fill="#c9d1d9">  `jest` is invoked but `jest` is not in any package.json  </tspan><tspan fill="#8b949e">missing-tool</tspan></text>
  <text x="24" y="398" textLength="285.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Tests: `npx jest`</tspan></text>
  <text x="24" y="419" textLength="663.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ The instructions may describe a tool the project no longer uses.</tspan></text>
  <text x="24" y="440" textLength="630" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">14</tspan><tspan fill="#c9d1d9">  `src/utils/format.ts` does not exist in the repo  </tspan><tspan fill="#8b949e">missing-path</tspan></text>
  <text x="24" y="461" textLength="546" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Formatting helpers live in `src/utils/format.ts`</tspan></text>
  <text x="24" y="482" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Did you mean `src/lib/format.ts`?</tspan></text>
  <text x="24" y="503" textLength="638.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">16</tspan><tspan fill="#c9d1d9">  Import `@docs/architecture.md` does not resolve  </tspan><tspan fill="#8b949e">missing-import</tspan></text>
  <text x="24" y="524" textLength="646.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Read @docs/architecture.md before touching state management.</tspan></text>
  <text x="24" y="545" textLength="596.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Imports resolve relative to the file that contains them.</tspan></text>
  <text x="24" y="566" textLength="588" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">info </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">20</tspan><tspan fill="#c9d1d9">  Generic instruction the agent already follows  </tspan><tspan fill="#8b949e">vague-rule</tspan></text>
  <text x="24" y="587" textLength="504" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Write clean code and follow best practices.</tspan></text>
  <text x="24" y="608" textLength="579.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Replace with a concrete, checkable rule, or delete it.</tspan></text>
  <text x="24" y="629" textLength="739.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">22</tspan><tspan fill="#c9d1d9">  `cargo test` is documented but the repo has no Cargo.toml  </tspan><tspan fill="#8b949e">missing-manifest</tspan></text>
  <text x="24" y="650" textLength="470.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Run `cargo test` for the native module.</tspan></text>
  <text x="24" y="671" textLength="705.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ This usually means the instructions were copied from another project.</tspan></text>
  <text x="24" y="692" textLength="680.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">23</tspan><tspan fill="#c9d1d9">  Possible credential: OpenAI/Anthropic-style API key  </tspan><tspan fill="#8b949e">secret-exposure</tspan></text>
  <text x="24" y="713" textLength="378" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Staging key for demos: sk-d…</tspan></text>
  <text x="24" y="734" textLength="898.8" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Instruction files are read by every agent and every contributor. Rotate it and use env vars.</tspan></text>
  <text x="24" y="755" textLength="0" lengthAdjust="spacing" xml:space="preserve"></text>
  <text x="24" y="776" textLength="75.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9" text-decoration="underline">CLAUDE.md</tspan></text>
  <text x="24" y="797" textLength="781.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 7</tspan><tspan fill="#c9d1d9">  Uses yarn (3 commands) but the repo is set up for pnpm  </tspan><tspan fill="#8b949e">package-manager-mismatch</tspan></text>
  <text x="24" y="818" textLength="336" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Install: `yarn install`</tspan></text>
  <text x="24" y="839" textLength="739.2" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Agents will follow this and create a second lockfile. Use `pnpm` instead.</tspan></text>
  <text x="24" y="860" textLength="680.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e"> 7</tspan><tspan fill="#c9d1d9">  Uses yarn, but AGENTS.md (line 7) uses npm  </tspan><tspan fill="#8b949e">conflicting-instructions</tspan></text>
  <text x="24" y="881" textLength="596.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Both files are read by agents. Keep one source of truth.</tspan></text>
  <text x="24" y="902" textLength="840" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">13</tspan><tspan fill="#c9d1d9">  Says to indent with spaces, but AGENTS.md (line 21) says tabs  </tspan><tspan fill="#8b949e">conflicting-instructions</tspan></text>
  <text x="24" y="923" textLength="630" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">warn </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">14</tspan><tspan fill="#c9d1d9">  6 lines (~90 tokens) are also in AGENTS.md  </tspan><tspan fill="#8b949e">duplicated-content</tspan></text>
  <text x="24" y="944" textLength="705.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Keep one file and symlink or @import it: `ln -sf AGENTS.md CLAUDE.md`</tspan></text>
  <text x="24" y="965" textLength="588" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#79c0ff">info </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#8b949e">19</tspan><tspan fill="#c9d1d9">  Generic instruction the agent already follows  </tspan><tspan fill="#8b949e">vague-rule</tspan></text>
  <text x="24" y="986" textLength="504" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">│ - Write clean code and follow best practices.</tspan></text>
  <text x="24" y="1007" textLength="579.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#c9d1d9">             </tspan><tspan fill="#8b949e">↳ Replace with a concrete, checkable rule, or delete it.</tspan></text>
  <text x="24" y="1028" textLength="0" lengthAdjust="spacing" xml:space="preserve"></text>
  <text x="24" y="1049" textLength="369.6" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#ff7b72">✖ 15 problems (5 errors, 7 warnings, 3 info)</tspan></text>
  <text x="24" y="1070" textLength="470.4" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#8b949e">Grounded: 10 of 22 checkable claims match the repo (45%)</tspan></text>
