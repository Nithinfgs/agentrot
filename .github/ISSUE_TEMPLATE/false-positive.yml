name: False positive / false negative
description: agentrot flagged something that is correct, or missed something that is wrong
labels: [heuristics]
body:
  - type: textarea
    id: line
    attributes:
      label: The instruction line
      description: Paste the exact line(s) from your AGENTS.md / CLAUDE.md
      render: markdown
    validations: { required: true }
  - type: textarea
    id: repo
    attributes:
      label: What the repo looks like
      description: Relevant package.json scripts, lockfile, directory layout. A public repo link is ideal.
    validations: { required: true }
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: missing-path
  - type: input
    id: version
    attributes:
      label: agentrot version (`agentrot --version`)
