name: Bug report
description: Crash, wrong exit code, broken output
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command, a minimal instruction file, and Node version / OS
    validations: { required: true }
